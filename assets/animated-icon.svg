<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#e8eaf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
  <line x1="8" y1="6" x2="16" y2="6"></line>
  
  <!-- Buttons -->
  <circle cx="8" cy="11" r="1.5" class="btn b1"></circle>
  <circle cx="12" cy="11" r="1.5" class="btn b2"></circle>
  <circle cx="16" cy="11" r="1.5" class="btn b3"></circle>
  
  <circle cx="8" cy="15" r="1.5" class="btn b4"></circle>
  <circle cx="12" cy="15" r="1.5" class="btn b5"></circle>
  <circle cx="16" cy="15" r="1.5" class="btn b6"></circle>
  
  <circle cx="8" cy="19" r="1.5" class="btn b7"></circle>
  <circle cx="12" cy="19" r="1.5" class="btn b8"></circle>
  <circle cx="16" cy="19" r="1.5" class="btn b9"></circle>

  <style>
    .btn { fill: #4f8ef7; stroke: none; }
    
    @keyframes pop {
      0%, 100% { transform: scale(1) translateY(0); fill: #4f8ef7; }
      50% { transform: scale(1.3) translateY(-1px); fill: #27c68a; }
    }
    
    .b1 { animation: pop 1.5s infinite 0.1s; transform-origin: 8px 11px; }
    .b2 { animation: pop 1.5s infinite 0.2s; transform-origin: 12px 11px; }
    .b3 { animation: pop 1.5s infinite 0.3s; transform-origin: 16px 11px; }
    .b4 { animation: pop 1.5s infinite 0.4s; transform-origin: 8px 15px; }
    .b5 { animation: pop 1.5s infinite 0.5s; transform-origin: 12px 15px; }
    .b6 { animation: pop 1.5s infinite 0.6s; transform-origin: 16px 15px; }
    .b7 { animation: pop 1.5s infinite 0.7s; transform-origin: 8px 19px; }
    .b8 { animation: pop 1.5s infinite 0.8s; transform-origin: 12px 19px; }
    .b9 { animation: pop 1.5s infinite 0.9s; transform-origin: 16px 19px; }
  </style>
</svg>
